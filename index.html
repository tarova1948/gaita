<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 400px;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    
    /* Größere Löcher für bessere Bedienung */
    .hole {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 3px solid rgba(255, 215, 0, 0.8);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .hole:active {
      background: rgba(255, 215, 0, 0.7);
    }

    /* Unsichtbare Zone in der Mitte, um BEIDE Löcher gleichzeitig zu spielen */
    .double-hole-zone {
      position: absolute;
      width: 120px;
      height: 60px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      /* optional leicht sichtbar zum Testen, sonst transparent */
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <img src="instrument.png" class="instrument-img" alt="Gaita">

  <!-- LINKES ROHR (Einzelne Löcher) -->
  <div class="hole" style="top: 25%; left: 38%;" data-note="440"></div>
  <div class="hole" style="top: 35%; left: 38%;" data-note="494"></div>
  <div class="hole" style="top: 45%; left: 38%;" data-note="523"></div>
  <div class="hole" style="top: 55%; left: 38%;" data-note="587"></div>
  <div class="hole" style="top: 65%; left: 38%;" data-note="659"></div>

  <!-- RECHTES ROHR (Einzelne Löcher) -->
  <div class="hole" style="top: 25%; left: 62%;" data-note="698"></div>
  <div class="hole" style="top: 35%; left: 62%;" data-note="784"></div>
  <div class="hole" style="top: 45%; left: 62%;" data-note="880"></div>
  <div class="hole" style="top: 55%; left: 62%;" data-note="987"></div>
  <div class="hole" style="top: 65%; left: 62%;" data-note="1046"></div>

  <!-- DOPPEL-ZONEN (Greift beide Löcher auf gleicher Höhe ab) -->
  <div class="double-hole-zone" style="top: 25%;" data-notes="440,698"></div>
  <div class="double-hole-zone" style="top: 35%;" data-notes="494,784"></div>
  <div class="double-hole-zone" style="top: 45%;" data-notes="523,880"></div>
  <div class="double-hole-zone" style="top: 55%;" data-notes="587,987"></div>
  <div class="double-hole-zone" style="top: 65%;" data-notes="659,1046"></div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
    osc.stop(audioCtx.currentTime + 0.8);
  }

  // Einzelne Löcher spielen
  document.querySelectorAll('.hole').forEach(hole => {
    const freq = parseFloat(hole.getAttribute('data-note'));
    
    const handlePlay = (e) => {
      e.preventDefault();
      e.stopPropagation(); // Verhindert Auslösen der Doppelzone
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playTone(freq);
    };

    hole.addEventListener('touchstart', handlePlay);
    hole.addEventListener('mousedown', handlePlay);
  });

  // Doppel-Zonen (beide Töne gleichzeitig spielen)
  document.querySelectorAll('.double-hole-zone').forEach(zone => {
    const freqs = zone.getAttribute('data-notes').split(',').map(Number);

    const handlePlayDouble = (e) => {
      e.preventDefault();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      freqs.forEach(f => playTone(f));
    };

    zone.addEventListener('touchstart', handlePlayDouble);
    zone.addEventListener('mousedown', handlePlayDouble);
  });
</script>

</body>
</html>
