<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 450px;
      height: 95vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    
    /* Viel größere Löcher für eine einfache Touch-Bedienung */
    .hole {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: 3px solid rgba(255, 215, 0, 0.9);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .hole:active {
      background: rgba(255, 215, 0, 0.85);
    }

    /* Unsichtbare Doppel-Zone in der Mitte für beide Löcher mit 1 Finger */
    .double-hole-zone {
      position: absolute;
      width: 140px;
      height: 80px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 40px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <img src="instrument.png" class="instrument-img" alt="Gaita">

  <!-- LINKES ROHR (5 Einzelne Löcher mit mehr Abstand) -->
  <div class="hole" style="top: 15%; left: 34%;" data-note="440"></div>
  <div class="hole" style="top: 32.5%; left: 34%;" data-note="494"></div>
  <div class="hole" style="top: 50%; left: 34%;" data-note="523"></div>
  <div class="hole" style="top: 67.5%; left: 34%;" data-note="587"></div>
  <div class="hole" style="top: 85%; left: 34%;" data-note="659"></div>

  <!-- RECHTES ROHR (5 Einzelne Löcher mit mehr Abstand) -->
  <div class="hole" style="top: 15%; left: 66%;" data-note="698"></div>
  <div class="hole" style="top: 32.5%; left: 66%;" data-note="784"></div>
  <div class="hole" style="top: 50%; left: 66%;" data-note="880"></div>
  <div class="hole" style="top: 67.5%; left: 66%;" data-note="987"></div>
  <div class="hole" style="top: 85%; left: 66%;" data-note="1046"></div>

  <!-- DOPPEL-ZONEN (Beide Löcher gleichzeitig mit einem Finger in der Mitte) -->
  <div class="double-hole-zone" style="top: 15%;" data-notes="440,698"></div>
  <div class="double-hole-zone" style="top: 32.5%;" data-notes="494,784"></div>
  <div class="double-hole-zone" style="top: 50%;" data-notes="523,880"></div>
  <div class="double-hole-zone" style="top: 67.5%;" data-notes="587,987"></div>
  <div class="double-hole-zone" style="top: 85%;" data-notes="659,1046"></div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
    osc.stop(audioCtx.currentTime + 0.8);
  }

  // Einzelne Löcher spielen
  document.querySelectorAll('.hole').forEach(hole => {
    const freq = parseFloat(hole.getAttribute('data-note'));
    
    const handlePlay = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playTone(freq);
    };

    hole.addEventListener('touchstart', handlePlay);
    hole.addEventListener('mousedown', handlePlay);
  });

  // Doppel-Zonen spielen (beide Rohre zusammen)
  document.querySelectorAll('.double-hole-zone').forEach(zone => {
    const freqs = zone.getAttribute('data-notes').split(',').map(Number);

    const handlePlayDouble = (e) => {
      e.preventDefault();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      freqs.forEach(f => playTone(f));
    };

    zone.addEventListener('touchstart', handlePlayDouble);
    zone.addEventListener('mousedown', handlePlayDouble);
  });
</script>

</body>
</html>
