<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ποντιακό Αγγείον App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    /* Top Bar Control */
    .top-bar {
      position: absolute;
      top: 15px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: rgba(20, 20, 20, 0.9);
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn.active {
      background: #ffd700;
      color: #111;
      box-shadow: 0 0 15px #ffd700;
    }

    /* App Container */
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 450px;
      height: 90vh;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    
    /* Dynamic Holes */
    .hole {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 215, 0, 0.85);
      transform: translate(-50%, -50%);
      z-index: 2;
      transition: background 0.05s;
    }
    .hole.active {
      background: rgba(255, 215, 0, 0.9);
      box-shadow: 0 0 15px #ffd700;
    }

    /* Double Zones */
    .double-hole-zone {
      position: absolute;
      width: 90px;
      height: 32px;
      left: 50.5%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: transparent;
    }

    /* Settings Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #1c1c1c;
      border: 2px solid #ffd700;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .modal-header h3 {
      margin: 0;
      color: #ffd700;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .setting-group {
      margin-bottom: 18px;
    }
    .setting-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ddd;
    }
    .setting-group input[type="range"] {
      width: 100%;
      accent-color: #ffd700;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .note-select-item {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .note-select-item select {
      background: #333;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 5px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn" id="startAirBtn">💨 Άνοιγμα Αέρα (Start)</button>
  <button class="btn" id="openSettingsBtn">⚙️ Ρυθμίσεις</button>
</div>

<div class="app-container">
  <img src="instrument.png" class="instrument-img" alt="Ποντιακό Αγγείον">

  <!-- ΑΡΙΣΤΕΡΟΣ ΑΥΛΟΣ (Ευθυγραμμισμένος με τα καλάμια της εικόνας) -->
  <div class="hole" id="hole-l1" style="top: 27.5%; left: 47.8%;" data-note="440.00"></div>
  <div class="hole" id="hole-l2" style="top: 35.5%; left: 47.8%;" data-note="392.00"></div>
  <div class="hole" id="hole-l3" style="top: 43.5%; left: 47.8%;" data-note="349.23"></div>
  <div class="hole" id="hole-l4" style="top: 51.5%; left: 47.8%;" data-note="329.63"></div>
  <div class="hole" id="hole-l5" style="top: 63.5%; left: 47.8%;" data-note="293.66"></div>

  <!-- ΔΕΞΙΟΣ ΑΥΛΟΣ -->
  <div class="hole" id="hole-r1" style="top: 27.5%; left: 53.2%;" data-note="440.00"></div>
  <div class="hole" id="hole-r2" style="top: 35.5%; left: 53.2%;" data-note="392.00"></div>
  <div class="hole" id="hole-r3" style="top: 43.5%; left: 53.2%;" data-note="349.23"></div>
  <div class="hole" id="hole-r4" style="top: 51.5%; left: 53.2%;" data-note="329.63"></div>
  <div class="hole" id="hole-r5" style="top: 63.5%; left: 53.2%;" data-note="293.66"></div>

  <!-- ΔΙΠΛΕΣ ΖΩΝΕΣ (Για ταυτόχρονο πάτημα) -->
  <div class="double-hole-zone" style="top: 27.5%;" data-targets="hole-l1,hole-r1"></div>
  <div class="double-hole-zone" style="top: 35.5%;" data-targets="hole-l2,hole-r2"></div>
  <div class="double-hole-zone" style="top: 43.5%;" data-targets="hole-l3,hole-r3"></div>
  <div class="double-hole-zone" style="top: 51.5%;" data-targets="hole-l4,hole-r4"></div>
  <div class="double-hole-zone" style="top: 63.5%;" data-targets="hole-l5,hole-r5"></div>
</div>

<!-- ΠΑΡΑΘΥΡΟ ΡΥΘΜΙΣΕΩΝ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Ρυθμίσεις Αγγείου</h3>
      <button class="close-btn" id="closeSettingsBtn">&times;</button>
    </div>

    <!-- Μέγεθος Τρυπών -->
    <div class="setting-group">
      <label for="holeSizeSlider">Μέγεθος Τρυπών: <span id="sizeVal">32px</span></label>
      <input type="range" id="holeSizeSlider" min="20" max="60" value="32">
    </div>

    <!-- Επιλογή Νότας ανά Τρύπα -->
    <div class="setting-group">
      <label>Κούρδισμα Τρυπών (Νότες):</label>
      <div class="notes-grid" id="notesGridContainer"></div>
    </div>
  </div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // Βασική Νότα Αγγείου (Όλες οι τρύπες κλειστές = Ντο / C4)
  const BASE_FREQ = 261.63; 

  let isAirActive = false;
  let leftPipeOsc = null, leftPipeGain = null;
  let rightPipeOsc = null, rightPipeGain = null;

  const noteOptions = [
    { label: "Do (C4 - 261.6 Hz)", val: 261.63 },
    { label: "Re (D4 - 293.7 Hz)", val: 293.66 },
    { label: "Mi (E4 - 329.6 Hz)", val: 329.63 },
    { label: "Fa (F4 - 349.2 Hz)", val: 349.23 },
    { label: "Sol (G4 - 392.0 Hz)", val: 392.00 },
    { label: "La (A4 - 440.0 Hz)", val: 440.00 },
    { label: "Si (B4 - 493.9 Hz)", val: 493.88 },
    { label: "Do High (C5 - 523.3 Hz)", val: 523.25 }
  ];

  // Έναρξη ασταμάτητου ήχου (Blowing Air)
  function toggleAir() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isAirActive = !isAirActive;
    const btn = document.getElementById('startAirBtn');

    if (isAirActive) {
      btn.classList.add('active');
      btn.innerText = '💨 Σταμάτημα Αέρα';

      // Αριστερός Αυλός
      leftPipeOsc = audioCtx.createOscillator();
      leftPipeGain = audioCtx.createGain();
      leftPipeOsc.type = 'sawtooth';
      leftPipeOsc.frequency.value = BASE_FREQ;
      leftPipeOsc.connect(leftPipeGain);
      leftPipeGain.connect(audioCtx.destination);
      leftPipeOsc.start();
      leftPipeGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

      // Δεξιός Αυλός
      rightPipeOsc = audioCtx.createOscillator();
      rightPipeGain = audioCtx.createGain();
      rightPipeOsc.type = 'sawtooth';
      rightPipeOsc.frequency.value = BASE_FREQ;
      rightPipeOsc.connect(rightPipeGain);
      rightPipeGain.connect(audioCtx.destination);
      rightPipeOsc.start();
      rightPipeGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

    } else {
      btn.classList.remove('active');
      btn.innerText = '💨 Άνοιγμα Αέρα (Start)';
      
      if (leftPipeOsc) { leftPipeOsc.stop(); leftPipeOsc.disconnect(); }
      if (rightPipeOsc) { rightPipeOsc.stop(); rightPipeOsc.disconnect(); }
    }
  }

  document.getElementById('startAirBtn').addEventListener('click', toggleAir);

  // Ενημέρωση συχνότητας κατά το πάτημα των τρυπών
  function updatePipesSound() {
    if (!isAirActive) return;

    // Βρίσκουμε την ενεργή τρύπα στον Αριστερό Αυλό
    const activeLeft = document.querySelector('.hole[id^="hole-l"].active');
    if (activeLeft) {
      leftPipeOsc.frequency.setValueAtTime(parseFloat(activeLeft.getAttribute('data-note')), audioCtx.currentTime);
    } else {
      leftPipeOsc.frequency.setValueAtTime(BASE_FREQ, audioCtx.currentTime);
    }

    // Βρίσκουμε την ενεργή τρύπα στον Δεξιό Αυλό
    const activeRight = document.querySelector('.hole[id^="hole-r"].active');
    if (activeRight) {
      rightPipeOsc.frequency.setValueAtTime(parseFloat(activeRight.getAttribute('data-note')), audioCtx.currentTime);
    } else {
      rightPipeOsc.frequency.setValueAtTime(BASE_FREQ, audioCtx.currentTime);
    }
  }

  // Event Handlers για Τρύπες
  const holes = document.querySelectorAll('.hole');
  holes.forEach(hole => {
    const handleStart = (e) => {
      e.preventDefault();
      hole.classList.add('active');
      updatePipesSound();
    };
    const handleEnd = (e) => {
      e.preventDefault();
      hole.classList.remove('active');
      updatePipesSound();
    };

    hole.addEventListener('touchstart', handleStart);
    hole.addEventListener('touchend', handleEnd);
    hole.addEventListener('mousedown', handleStart);
    hole.addEventListener('mouseup', handleEnd);
    hole.addEventListener('mouseleave', handleEnd);
  });

  // Event Handlers για Διπλές Ζώνες
  document.querySelectorAll('.double-hole-zone').forEach(zone => {
    const targetIds = zone.getAttribute('data-targets').split(',');

    const handleStartDouble = (e) => {
      e.preventDefault();
      targetIds.forEach(id => document.getElementById(id)?.classList.add('active'));
      updatePipesSound();
    };

    const handleEndDouble = (e) => {
      e.preventDefault();
      targetIds.forEach(id => document.getElementById(id)?.classList.remove('active'));
      updatePipesSound();
    };

    zone.addEventListener('touchstart', handleStartDouble);
    zone.addEventListener('touchend', handleEndDouble);
    zone.addEventListener('mousedown', handleStartDouble);
    zone.addEventListener('mouseup', handleEndDouble);
    zone.addEventListener('mouseleave', handleEndDouble);
  });

  // Ρυθμίσεις (Modal & Sliders)
  const modal = document.getElementById('settingsModal');
  document.getElementById('openSettingsBtn').addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.classList.remove('open'));

  const holeSizeSlider = document.getElementById('holeSizeSlider');
  const sizeValText = document.getElementById('sizeVal');
  
  holeSizeSlider.addEventListener('input', (e) => {
    const newSize = e.target.value + 'px';
    sizeValText.innerText = newSize;
    holes.forEach(h => {
      h.style.width = newSize;
      h.style.height = newSize;
    });
    document.querySelectorAll('.double-hole-zone').forEach(z => z.style.height = newSize);
  });

  // Δημιουργία Dropdowns στις Ρυθμίσεις
  const notesContainer = document.getElementById('notesGridContainer');
  holes.forEach((hole) => {
    const holeId = hole.id;
    const currentFreq = parseFloat(hole.getAttribute('data-note'));
    
    const item = document.createElement('div');
    item.className = 'note-select-item';
    
    const label = document.createElement('label');
    label.innerText = (holeId.includes('-l') ? 'Αριστερά ' : 'Δεξιά ') + (holeId.slice(-1));

    const select = document.createElement('select');
    noteOptions.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.val;
      option.innerText = opt.label;
      if (Math.abs(opt.val - currentFreq) < 1) option.selected = true;
      select.appendChild(option);
    });

    select.addEventListener('change', (e) => {
      hole.setAttribute('data-note', e.target.value);
      updatePipesSound();
    });

    item.appendChild(label);
    item.appendChild(select);
    notesContainer.appendChild(item);
  });
</script>

</body>
</html>
