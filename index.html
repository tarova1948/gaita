<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita / Angeion App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    /* Top Bar Controls */
    .top-bar {
      position: fixed;
      top: 12px;
      z-index: 999;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      background: rgba(30, 30, 30, 0.95);
      color: #ffd700;
      border: 1.5px solid #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
      touch-action: auto;
    }
    .btn.active {
      background: #ffd700;
      color: #121212;
      box-shadow: 0 0 10px #ffd700;
    }

    /* Main Container */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* Wrapper που κρατάει τη φωτογραφία και τις τρύπες μαζί */
    .img-wrapper {
      position: relative;
      height: 98vh; /* Μεγέθυνση οργάνου */
      display: inline-block;
    }

    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }
    
    /* Holes Dynamic */
    .hole {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 215, 0, 0.85);
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: auto;
      transition: background 0.1s;
    }
    .hole.active {
      background: rgba(255, 215, 0, 0.85);
      box-shadow: 0 0 12px #ffd700;
    }

    /* Θέσεις τρυπών σε % ως προς το πλάτος του αυλού */
    .hole-left {
      left: 45%;
    }
    .hole-right {
      left: 55%;
    }

    /* Doppel-Zonen */
    .double-hole-zone {
      position: absolute;
      width: 35%;
      height: 40px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: transparent;
      pointer-events: auto;
    }

    /* Modal / Ρυθμίσεις Παράθυρο */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      touch-action: auto;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #222;
      border: 2px solid #ffd700;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .modal-header h3 {
      margin: 0;
      color: #ffd700;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .setting-group {
      margin-bottom: 18px;
    }
    .setting-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ddd;
    }
    .setting-group input[type="range"] {
      width: 100%;
      accent-color: #ffd700;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .note-select-item {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .note-select-item select {
      background: #333;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 4px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn" id="droneBtn">Bordun: AUS</button>
  <button class="btn" id="openSettingsBtn">⚙️ Ρυθμίσεις</button>
</div>

<div class="app-container" id="instrumentContainer">
  <div class="img-wrapper">
    <img src="Screenshot_20260830_151308_Gallery(1).jpg" class="instrument-img" alt="Gaita Angeion">

    <!-- ΑΡΙΣΤΕΡΟΣ ΑΥΛΟΣ (Ακριβής στοίχιση πάνω στα καλάμια της φωτογραφίας) -->
    <div class="hole hole-left" id="hole-l1" style="top: 27.2%;"></div>
    <div class="hole hole-left" id="hole-l2" style="top: 35.5%;"></div>
    <div class="hole hole-left" id="hole-l3" style="top: 43.5%;"></div>
    <div class="hole hole-left" id="hole-l4" style="top: 50.5%;"></div>
    <div class="hole hole-left" id="hole-l5" style="top: 62.5%;"></div>

    <!-- ΔΕΞΙΟΣ ΑΥΛΟΣ (Ακριβής στοίχιση πάνω στα καλάμια της φωτογραφίας) -->
    <div class="hole hole-right" id="hole-r1" style="top: 27.2%;"></div>
    <div class="hole hole-right" id="hole-r2" style="top: 35.5%;"></div>
    <div class="hole hole-right" id="hole-r3" style="top: 43.5%;"></div>
    <div class="hole hole-right" id="hole-r4" style="top: 50.5%;"></div>
    <div class="hole hole-right" id="hole-r5" style="top: 62.5%;"></div>

    <!-- ΔΙΠΛΕΣ ΖΩΝΕΣ -->
    <div class="double-hole-zone" style="top: 27.2%;" data-targets="hole-l1,hole-r1"></div>
    <div class="double-hole-zone" style="top: 35.5%;" data-targets="hole-l2,hole-r2"></div>
    <div class="double-hole-zone" style="top: 43.5%;" data-targets="hole-l3,hole-r3"></div>
    <div class="double-hole-zone" style="top: 50.5%;" data-targets="hole-l4,hole-r4"></div>
    <div class="double-hole-zone" style="top: 62.5%;" data-targets="hole-l5,hole-r5"></div>
  </div>
</div>

<!-- MODAL ΡΥΘΜΙΣΕΩΝ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Ρυθμίσεις (Einstellungen)</h3>
      <button class="close-btn" id="closeSettingsBtn">&times;</button>
    </div>

    <!-- 1. Μέγεθος Τρυπών (10px έως 100px) -->
    <div class="setting-group">
      <label for="holeSizeSlider">Μέγεθος Τρυπών (Lochgröße): <span id="sizeVal">40px</span></label>
      <input type="range" id="holeSizeSlider" min="10" max="100" value="40">
    </div>

    <!-- 2. Απόσταση Αριστερά/Δεξιά -->
    <div class="setting-group">
      <label for="holeSpacingSlider">Απόσταση Αυλών (Lochabstand): <span id="spacingVal">5%</span></label>
      <input type="range" id="holeSpacingSlider" min="1" max="15" value="5">
    </div>

    <!-- 3. Επιλογή Νότας -->
    <div class="setting-group">
      <label>Ρύθμιση Νότας ανά Τρύπα (Noten-Stimmung):</label>
      <div class="notes-grid" id="notesGridContainer"></div>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;
  const activeOscillators = new Map();

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const noteOptions = [
    { label: "Do (C4 - 261.6 Hz)", val: 261.63 },
    { label: "Re (D4 - 293.7 Hz)", val: 293.66 },
    { label: "Mi (E4 - 329.6 Hz)", val: 329.63 },
    { label: "Fa (F4 - 349.2 Hz)", val: 349.23 },
    { label: "Sol (G4 - 392.0 Hz)", val: 392.00 },
    { label: "La (A4 - 440.0 Hz)", val: 440.00 },
    { label: "Si (B4 - 493.9 Hz)", val: 493.88 },
    { label: "Do High (C5 - 523.3 Hz)", val: 523.25 },
    { label: "Re High (D5 - 587.3 Hz)", val: 587.33 }
  ];

  function startTone(key, freq) {
    initAudio();
    if (activeOscillators.has(key)) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.04);

    activeOscillators.set(key, { osc, gain });
  }

  function stopTone(key) {
    if (!activeOscillators.has(key)) return;
    const { osc, gain } = activeOscillators.get(key);
    
    gain.gain.setValueAtTime(gain.gain.value, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
    
    setTimeout(() => {
      try {
        osc.stop();
        osc.disconnect();
      } catch(e){}
    }, 80);
    
    activeOscillators.delete(key);
  }

  // Modal Controls
  const modal = document.getElementById('settingsModal');
  const openSettingsBtn = document.getElementById('openSettingsBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');

  function openModal(e) { if(e) e.preventDefault(); modal.classList.add('open'); }
  function closeModal(e) { if(e) e.preventDefault(); modal.classList.remove('open'); }

  openSettingsBtn.addEventListener('click', openModal);
  openSettingsBtn.addEventListener('touchstart', openModal, { passive: false });
  closeSettingsBtn.addEventListener('click', closeModal);
  closeSettingsBtn.addEventListener('touchstart', closeModal, { passive: false });

  // Dynamic Hole Size Adjuster
  const holeSizeSlider = document.getElementById('holeSizeSlider');
  const sizeValText = document.getElementById('sizeVal');
  
  holeSizeSlider.addEventListener('input', (e) => {
    const holeSizeNum = parseInt(e.target.value);
    const newSize = holeSizeNum + 'px';

    sizeValText.innerText = newSize;
    
    document.querySelectorAll('.hole').forEach(h => {
      h.style.width = newSize;
      h.style.height = newSize;
    });

    document.querySelectorAll('.double-hole-zone').forEach(z => {
      z.style.height = newSize;
    });
  });

  // Dynamic Spacing Adjuster (Απόσταση Αριστερά / Δεξιά)
  const holeSpacingSlider = document.getElementById('holeSpacingSlider');
  const spacingValText = document.getElementById('spacingVal');

  holeSpacingSlider.addEventListener('input', (e) => {
    const offset = parseInt(e.target.value);
    spacingValText.innerText = offset + '%';

    document.querySelectorAll('.hole-left').forEach(h => {
      h.style.left = (50 - offset) + '%';
    });
    document.querySelectorAll('.hole-right').forEach(h => {
      h.style.left = (50 + offset) + '%';
    });
  });

  // Dynamic Notes Menu
  const notesContainer = document.getElementById('notesGridContainer');
  const holes = document.querySelectorAll('.hole');

  // Αρχικές Νότες
  const defaultNotes = {
    'hole-l1': 440.00,
    'hole-r1': 493.88,
    'hole-l2': 392.00,
    'hole-r2': 349.23,
    'hole-l3': 349.23,
    'hole-r3': 329.63,
    'hole-l4': 329.63,
    'hole-r4': 293.66,
    'hole-l5': 293.66,
    'hole-r5': 261.63
  };

  Object.keys(defaultNotes).forEach(id => {
    const holeEl = document.getElementById(id);
    if (holeEl) holeEl.setAttribute('data-note', defaultNotes[id]);
  });

  for (let i = 1; i <= 5; i++) {
    const pair = [`hole-l${i}`, `hole-r${i}`];
    
    pair.forEach(holeId => {
      const hole = document.getElementById(holeId);
      const currentFreq = parseFloat(hole.getAttribute('data-note'));
      
      const item = document.createElement('div');
      item.className = 'note-select-item';
      
      const label = document.createElement('label');
      label.innerText = (holeId.includes('-l') ? `Left ${i}` : `Right ${i}`);

      const select = document.createElement('select');
      noteOptions.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.val;
        option.innerText = opt.label;
        if (Math.abs(opt.val - currentFreq) < 1) option.selected = true;
        select.appendChild(option);
      });

      select.addEventListener('change', (e) => {
        hole.setAttribute('data-note', e.target.value);
      });

      item.appendChild(label);
      item.appendChild(select);
      notesContainer.appendChild(item);
    });
  }

  // Bordun / Drone
  let droneActive = false;
  const droneBtn = document.getElementById('droneBtn');

  function toggleDrone(e) {
    if (e) e.preventDefault();
    droneActive = !droneActive;
    if (droneActive) {
      startTone('drone', 261.63);
      droneBtn.classList.add('active');
      droneBtn.innerText = 'Bordun: EIN';
    } else {
      stopTone('drone');
      droneBtn.classList.remove('active');
      droneBtn.innerText = 'Bordun: AUS';
    }
  }

  droneBtn.addEventListener('click', toggleDrone);
  droneBtn.addEventListener('touchstart', toggleDrone, { passive: false });

  // Multi-Touch Event System
  function handleTouches(e) {
    e.preventDefault();
    
    const touchedHoleIds = new Set();

    for (let i = 0; i < e.touches.length; i++) {
      const touch = e.touches[i];
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);

      if (!elem) continue;

      if (elem.classList.contains('hole')) {
        touchedHoleIds.add(elem.id);
      } else if (elem.classList.contains('double-hole-zone')) {
        const targetIds = elem.getAttribute('data-targets').split(',');
        targetIds.forEach(id => touchedHoleIds.add(id));
      }
    }

    let activeLeftHole = null;
    for (let i = 1; i <= 5; i++) {
      const id = `hole-l${i}`;
      if (touchedHoleIds.has(id)) {
        activeLeftHole = id;
        break;
      }
    }

    let activeRightHole = null;
    for (let i = 1; i <= 5; i++) {
      const id = `hole-r${i}`;
      if (touchedHoleIds.has(id)) {
        activeRightHole = id;
        break;
      }
    }

    holes.forEach(hole => {
      const id = hole.id;
      const isTouched = touchedHoleIds.has(id);
      const isSounding = (id === activeLeftHole || id === activeRightHole);

      if (isTouched) {
        hole.classList.add('active');
      } else {
        hole.classList.remove('active');
      }

      if (isSounding) {
        startTone(id, parseFloat(hole.getAttribute('data-note')));
      } else {
        stopTone(id);
      }
    });
  }

  const container = document.getElementById('instrumentContainer');
  container.addEventListener('touchstart', handleTouches, { passive: false });
  container.addEventListener('touchmove', handleTouches, { passive: false });
  container.addEventListener('touchend', handleTouches, { passive: false });
  container.addEventListener('touchcancel', handleTouches, { passive: false });
</script>

</body>
</html>
