<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ποντιακό Αγγείον App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    /* Top Bar Control */
    .top-bar {
      position: absolute;
      top: 10px;
      z-index: 10;
      display: flex;
      gap: 12px;
      touch-action: auto;
    }
    .btn {
      background: rgba(20, 20, 20, 0.9);
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .btn.active {
      background: #ffd700;
      color: #111;
      box-shadow: 0 0 15px #ffd700;
    }

    /* Container Καλαμιών */
    .app-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 50px;
    }

    /* Σχεδιασμός Καλαμιού */
    .pipe {
      position: relative;
      width: 50px; 
      height: 80vh;
      background: linear-gradient(90deg, #5c3a21 0%, #a0683a 35%, #d19558 50%, #a0683a 65%, #5c3a21 100%);
      border-radius: 12px 12px 4px 4px;
      border: 2px solid #3d2312;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.7), 0 5px 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 25px 0 15px 0;
      transition: width 0.2s ease;
    }

    /* Έξοδος / Στόμιο Καλαμιού (Κάτω Μέρος) */
    .pipe-outlet {
      position: absolute;
      bottom: -12px;
      width: 80%;
      height: 12px;
      background: radial-gradient(ellipse at center, #2b180d 0%, #6e4627 60%, #3d2312 100%);
      border: 2px solid #a0683a;
      border-top: none;
      border-radius: 0 0 50% 50%;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), 0 4px 8px rgba(0,0,0,0.8);
      z-index: 1;
    }

    /* Τρύπες */
    .hole {
      width: 30px; 
      height: 30px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #ffd700;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
      z-index: 2;
      transition: background 0.05s, transform 0.05s;
    }
    .hole.active {
      background: #ffd700;
      box-shadow: 0 0 15px #ffd700;
      transform: scale(1.15);
    }

    /* Διπλές Ζώνες */
    .middle-bridge {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 0 15px 0;
      z-index: 3;
      pointer-events: none;
    }
    .double-hole-zone {
      width: 100%;
      height: 45px;
      pointer-events: auto;
      background: transparent;
    }

    /* Modal Ρυθμίσεων */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      touch-action: auto;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #1c1c1c;
      border: 2px solid #ffd700;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .modal-header h3 {
      margin: 0;
      color: #ffd700;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .setting-group {
      margin-bottom: 18px;
    }
    .setting-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ddd;
    }
    .setting-group input[type="range"] {
      width: 100%;
      accent-color: #ffd700;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .note-select-item {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .note-select-item select {
      background: #333;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 5px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn" id="startAirBtn">💨 Άνοιγμα Αέρα (Start)</button>
  <button class="btn" id="openSettingsBtn">⚙️ Ρυθμίσεις</button>
</div>

<div class="app-container" id="instrumentContainer">
  <!-- ΑΡΙΣΤΕΡΟ ΚΑΛΑΜΙ -->
  <div class="pipe" id="leftPipe">
    <div class="hole" id="hole-l1" data-index="1" data-note="523.25"></div>
    <div class="hole" id="hole-l2" data-index="2" data-note="493.88"></div>
    <div class="hole" id="hole-l3" data-index="3" data-note="440.00"></div>
    <div class="hole" id="hole-l4" data-index="4" data-note="392.00"></div>
    <div class="hole" id="hole-l5" data-index="5" data-note="349.23"></div>
    <div class="pipe-outlet"></div> <!-- Έξοδος Αέρα -->
  </div>

  <!-- ΔΕΞΙ ΚΑΛΑΜΙ -->
  <div class="pipe" id="rightPipe">
    <div class="hole" id="hole-r1" data-index="1" data-note="523.25"></div>
    <div class="hole" id="hole-r2" data-index="2" data-note="493.88"></div>
    <div class="hole" id="hole-r3" data-index="3" data-note="440.00"></div>
    <div class="hole" id="hole-r4" data-index="4" data-note="392.00"></div>
    <div class="hole" id="hole-r5" data-index="5" data-note="349.23"></div>
    <div class="pipe-outlet"></div> <!-- Έξοδος Αέρα -->
  </div>

  <!-- ΔΙΠΛΕΣ ΖΩΝΕΣ -->
  <div class="middle-bridge">
    <div class="double-hole-zone" data-targets="hole-l1,hole-r1"></div>
    <div class="double-hole-zone" data-targets="hole-l2,hole-r2"></div>
    <div class="double-hole-zone" data-targets="hole-l3,hole-r3"></div>
    <div class="double-hole-zone" data-targets="hole-l4,hole-r4"></div>
    <div class="double-hole-zone" data-targets="hole-l5,hole-r5"></div>
  </div>
</div>

<!-- ΠΑΡΑΘΥΡΟ ΡΥΘΜΙΣΕΩΝ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Ρυθμίσεις Αγγείου</h3>
      <button class="close-btn" id="closeSettingsBtn">&times;</button>
    </div>

    <div class="setting-group">
      <label for="holeSizeSlider">Πλάτος Τρυπών & Καλαμιού: <span id="sizeVal">30px</span></label>
      <input type="range" id="holeSizeSlider" min="20" max="55" value="30">
    </div>

    <div class="setting-group">
      <label>Κούρδισμα Τρυπών (Νότες):</label>
      <div class="notes-grid" id="notesGridContainer"></div>
    </div>
  </div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const BASE_FREQ = 293.66; 

  let isAirActive = false;
  let leftPipeOsc = null, leftPipeGain = null;
  let rightPipeOsc = null, rightPipeGain = null;

  const noteOptions = [
    { label: "Do (C4 - 261.6 Hz)", val: 261.63 },
    { label: "Re (D4 - 293.7 Hz)", val: 293.66 },
    { label: "Mi (E4 - 329.6 Hz)", val: 329.63 },
    { label: "Fa (F4 - 349.2 Hz)", val: 349.23 },
    { label: "Sol (G4 - 392.0 Hz)", val: 392.00 },
    { label: "La (A4 - 440.0 Hz)", val: 440.00 },
    { label: "Si (B4 - 493.9 Hz)", val: 493.88 },
    { label: "Do High (C5 - 523.3 Hz)", val: 523.25 }
  ];

  function toggleAir() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isAirActive = !isAirActive;
    const btn = document.getElementById('startAirBtn');

    if (isAirActive) {
      btn.classList.add('active');
      btn.innerText = '💨 Σταμάτημα Αέρα';

      leftPipeOsc = audioCtx.createOscillator();
      leftPipeGain = audioCtx.createGain();
      leftPipeOsc.type = 'sawtooth';
      leftPipeOsc.frequency.value = BASE_FREQ;
      leftPipeOsc.connect(leftPipeGain);
      leftPipeGain.connect(audioCtx.destination);
      leftPipeOsc.start();
      leftPipeGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

      rightPipeOsc = audioCtx.createOscillator();
      rightPipeGain = audioCtx.createGain();
      rightPipeOsc.type = 'sawtooth';
      rightPipeOsc.frequency.value = BASE_FREQ;
      rightPipeOsc.connect(rightPipeGain);
      rightPipeGain.connect(audioCtx.destination);
      rightPipeOsc.start();
      rightPipeGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

      updatePipesSound();
    } else {
      btn.classList.remove('active');
      btn.innerText = '💨 Άνοιγμα Αέρα (Start)';
      
      if (leftPipeOsc) { leftPipeOsc.stop(); leftPipeOsc.disconnect(); }
      if (rightPipeOsc) { rightPipeOsc.stop(); rightPipeOsc.disconnect(); }
    }
  }

  document.getElementById('startAirBtn').addEventListener('click', toggleAir);

  function getPipeFrequency(pipeId) {
    const activeHoles = Array.from(document.querySelectorAll(`#${pipeId} .hole.active`));
    if (activeHoles.length === 0) return BASE_FREQ;
    
    activeHoles.sort((a, b) => parseInt(b.getAttribute('data-index')) - parseInt(a.getAttribute('data-index')));
    return parseFloat(activeHoles[0].getAttribute('data-note'));
  }

  function updatePipesSound() {
    if (!isAirActive) return;

    const leftFreq = getPipeFrequency('leftPipe');
    const rightFreq = getPipeFrequency('rightPipe');

    leftPipeOsc.frequency.setValueAtTime(leftFreq, audioCtx.currentTime);
    rightPipeOsc.frequency.setValueAtTime(rightFreq, audioCtx.currentTime);
  }

  // Multi-Touch Sliding
  const holes = document.querySelectorAll('.hole');

  function handleTouches(e) {
    e.preventDefault();
    
    holes.forEach(h => h.classList.remove('active'));

    for (let i = 0; i < e.touches.length; i++) {
      const touch = e.touches[i];
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);

      if (!elem) continue;

      if (elem.classList.contains('hole')) {
        elem.classList.add('active');
      } else if (elem.classList.contains('double-hole-zone')) {
        const targetIds = elem.getAttribute('data-targets').split(',');
        document.getElementById(targetIds[0])?.classList.add('active');
        document.getElementById(targetIds[1])?.classList.add('active');
      }
    }

    updatePipesSound();
  }

  const container = document.getElementById('instrumentContainer');
  container.addEventListener('touchstart', handleTouches, { passive: false });
  container.addEventListener('touchmove', handleTouches, { passive: false });
  container.addEventListener('touchend', handleTouches, { passive: false });
  container.addEventListener('touchcancel', handleTouches, { passive: false });

  // Ρυθμίσεις Modal
  const modal = document.getElementById('settingsModal');
  document.getElementById('openSettingsBtn').addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.classList.remove('open'));

  const holeSizeSlider = document.getElementById('holeSizeSlider');
  const sizeValText = document.getElementById('sizeVal');
  const leftPipe = document.getElementById('leftPipe');
  const rightPipe = document.getElementById('rightPipe');
  
  holeSizeSlider.addEventListener('input', (e) => {
    const holeSize = parseInt(e.target.value);
    const pipeWidth = holeSize + 20;

    sizeValText.innerText = holeSize + 'px';
    
    holes.forEach(h => {
      h.style.width = holeSize + 'px';
      h.style.height = holeSize + 'px';
    });

    leftPipe.style.width = pipeWidth + 'px';
    rightPipe.style.width = pipeWidth + 'px';
  });

  // Dropdowns Νότες
  const notesContainer = document.getElementById('notesGridContainer');
  holes.forEach((hole) => {
    const holeId = hole.id;
    const currentFreq = parseFloat(hole.getAttribute('data-note'));
    
    const item = document.createElement('div');
    item.className = 'note-select-item';
    
    const label = document.createElement('label');
    label.innerText = (holeId.includes('-l') ? 'Αριστερά ' : 'Δεξιά ') + (holeId.slice(-1));

    const select = document.createElement('select');
    noteOptions.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.val;
      option.innerText = opt.label;
      if (Math.abs(opt.val - currentFreq) < 1) option.selected = true;
      select.appendChild(option);
    });

    select.addEventListener('change', (e) => {
      hole.setAttribute('data-note', e.target.value);
      updatePipesSound();
    });

    item.appendChild(label);
    item.appendChild(select);
    notesContainer.appendChild(item);
  });
</script>

</body>
</html>
