<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita / Angeion Dynamic Reeds App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    /* Top Bar Controls */
    .top-bar {
      position: fixed;
      top: 12px;
      z-index: 999;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      background: rgba(30, 30, 30, 0.95);
      color: #ffd700;
      border: 1.5px solid #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
      touch-action: auto;
    }
    .btn.active {
      background: #ffd700;
      color: #121212;
      box-shadow: 0 0 10px #ffd700;
    }

    /* Main Container */
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 90vh;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* Dynamic Wooden Reeds / Καλάμια που μεγαλώνουν/μικραίνουν */
    .reed-pipe {
      position: absolute;
      width: 16mm;
      background: linear-gradient(90deg, #5c3a21 0%, #a0683a 30%, #c48b55 50%, #a0683a 70%, #5c3a21 100%);
      border: 2px solid #3d2312;
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5);
      z-index: 5;
      pointer-events: none;
      /* Υπολογισμός ύψους αυτόματα από την 1η έως την 5η τρύπα */
      top: calc(150mm - 8mm);
      height: calc(320mm - 150mm + 16mm);
    }

    /* Τοποθέτηση Καλαμιών πίσω από τις τρύπες */
    .reed-pipe.left {
      left: calc(50% - 4mm - 2.5mm);
      transform: translateX(-50%);
    }
    .reed-pipe.right {
      left: calc(50% + 4mm + 2.5mm);
      transform: translateX(-50%);
    }

    /* Holes Dynamic Base - Διάμετρος 8mm */
    .hole {
      position: absolute;
      width: 8mm;
      height: 8mm;
      border-radius: 50%;
      background: #121212;
      border: 2px solid rgba(255, 215, 0, 0.9);
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: auto;
      transition: background 0.1s, transform 0.1s;
    }
    .hole.active {
      background: rgba(255, 215, 0, 0.85);
      box-shadow: 0 0 14px #ffd700;
    }

    /* ΑΡΙΣΤΕΡΕΣ ΤΡΥΠΕΣ */
    .hole-left {
      left: calc(50% - 4mm - 2.5mm);
    }

    /* ΔΕΞΙΕΣ ΤΡΥΠΕΣ */
    .hole-right {
      left: calc(50% + 4mm + 2.5mm);
    }

    /* ΚΑΘΕΤΕΣ ΘΕΣΕΙΣ ΣΕ ΧΙΛΙΟΣΤΑ */
    .row-1 { top: 150mm; }
    .row-2 { top: 182mm; }
    .row-3 { top: 252mm; }
    .row-4 { top: 286mm; }
    .row-5 { top: 320mm; }

    /* Doppel-Zonen (Διπλές Ζώνες στη μέση για πάτημα και των δύο τρυπών) */
    .double-hole-zone {
      position: absolute;
      width: 25mm;
      height: 10mm;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: transparent;
      pointer-events: auto;
    }

    /* Modal / Ρυθμίσεις Παράθυρο */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      touch-action: auto;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #222;
      border: 2px solid #ffd700;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .modal-header h3 {
      margin: 0;
      color: #ffd700;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .setting-group {
      margin-bottom: 18px;
    }
    .setting-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ddd;
    }
    .setting-group input[type="range"] {
      width: 100%;
      accent-color: #ffd700;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .note-select-item {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .note-select-item select {
      background: #333;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 4px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn" id="droneBtn">Bordun: AUS</button>
  <button class="btn" id="openSettingsBtn">⚙️ Ρυθμίσεις</button>
</div>

<div class="app-container" id="instrumentContainer">
  <!-- ΔΥΝΑΜΙΚΑ ΚΑΛΑΜΙΑ (ΞΥΛΟ) -->
  <div class="reed-pipe left" id="reedLeft"></div>
  <div class="reed-pipe right" id="reedRight"></div>

  <!-- ΑΡΙΣΤΕΡΟΣ ΑΥΛΟΣ -->
  <div class="hole hole-left row-1" id="hole-l1" data-note="440.00"></div>
  <div class="hole hole-left row-2" id="hole-l2" data-note="392.00"></div>
  <div class="hole hole-left row-3" id="hole-l3" data-note="349.23"></div>
  <div class="hole hole-left row-4" id="hole-l4" data-note="329.63"></div>
  <div class="hole hole-left row-5" id="hole-l5" data-note="293.66"></div>

  <!-- ΔΕΞΙΟΣ ΑΥΛΟΣ -->
  <div class="hole hole-right row-1" id="hole-r1" data-note="440.00"></div>
  <div class="hole hole-right row-2" id="hole-r2" data-note="392.00"></div>
  <div class="hole hole-right row-3" id="hole-r3" data-note="349.23"></div>
  <div class="hole hole-right row-4" id="hole-r4" data-note="329.63"></div>
  <div class="hole hole-right row-5" id="hole-r5" data-note="293.66"></div>

  <!-- ΔΙΠΛΕΣ ΖΩΝΕΣ -->
  <div class="double-hole-zone row-1" data-targets="hole-l1,hole-r1"></div>
  <div class="double-hole-zone row-2" data-targets="hole-l2,hole-r2"></div>
  <div class="double-hole-zone row-3" data-targets="hole-l3,hole-r3"></div>
  <div class="double-hole-zone row-4" data-targets="hole-l4,hole-r4"></div>
  <div class="double-hole-zone row-5" data-targets="hole-l5,hole-r5"></div>
</div>

<!-- MODAL ΡΥΘΜΙΣΕΩΝ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Ρυθμίσεις (Einstellungen)</h3>
      <button class="close-btn" id="closeSettingsBtn">&times;</button>
    </div>

    <!-- 1. Μέγεθος Τρυπών -->
    <div class="setting-group">
      <label for="holeSizeSlider">Διάμετρος Τρυπών: <span id="sizeVal">8mm</span></label>
      <input type="range" id="holeSizeSlider" min="5" max="15" value="8">
    </div>

    <!-- 2. Επιλογή Νότας -->
    <div class="setting-group">
      <label>Ρύθμιση Νότας ανά Τρύπα:</label>
      <div class="notes-grid" id="notesGridContainer"></div>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;
  const activeOscillators = new Map();

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const noteOptions = [
    { label: "Do (C4 - 261.6 Hz)", val: 261.63 },
    { label: "Re (D4 - 293.7 Hz)", val: 293.66 },
    { label: "Mi (E4 - 329.6 Hz)", val: 329.63 },
    { label: "Fa (F4 - 349.2 Hz)", val: 349.23 },
    { label: "Sol (G4 - 392.0 Hz)", val: 392.00 },
    { label: "La (A4 - 440.0 Hz)", val: 440.00 },
    { label: "Si (B4 - 493.9 Hz)", val: 493.88 },
    { label: "Do High (C5 - 523.3 Hz)", val: 523.25 },
    { label: "Re High (D5 - 587.3 Hz)", val: 587.33 }
  ];

  function startTone(key, freq) {
    initAudio();
    if (activeOscillators.has(key)) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.04);

    activeOscillators.set(key, { osc, gain });
  }

  function stopTone(key) {
    if (!activeOscillators.has(key)) return;
    const { osc, gain } = activeOscillators.get(key);
    
    gain.gain.setValueAtTime(gain.gain.value, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
    
    setTimeout(() => {
      try {
        osc.stop();
        osc.disconnect();
      } catch(e){}
    }, 80);
    
    activeOscillators.delete(key);
  }

  // Modal Controls
  const modal = document.getElementById('settingsModal');
  const openSettingsBtn = document.getElementById('openSettingsBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');

  function openModal(e) { if(e) e.preventDefault(); modal.classList.add('open'); }
  function closeModal(e) { if(e) e.preventDefault(); modal.classList.remove('open'); }

  openSettingsBtn.addEventListener('click', openModal);
  openSettingsBtn.addEventListener('touchstart', openModal, { passive: false });
  closeSettingsBtn.addEventListener('click', closeModal);
  closeSettingsBtn.addEventListener('touchstart', closeModal, { passive: false });

  // Dynamic Hole Size & Reed Pipe Size Adjuster (mm)
  const holeSizeSlider = document.getElementById('holeSizeSlider');
  const sizeValText = document.getElementById('sizeVal');
  
  holeSizeSlider.addEventListener('input', (e) => {
    const mmVal = parseInt(e.target.value);
    const newSize = mmVal + 'mm';
    const halfHole = (mmVal / 2) + 'mm';

    sizeValText.innerText = newSize;
    
    document.querySelectorAll('.hole').forEach(h => {
      h.style.width = newSize;
      h.style.height = newSize;
    });

    // Προσαρμογή πλάτους καλαμιών ανάλογα με το μέγεθος των τρυπών
    const reedWidth = (mmVal + 8) + 'mm';
    document.querySelectorAll('.reed-pipe').forEach(r => {
      r.style.width = reedWidth;
    });

    document.querySelectorAll('.hole-left').forEach(h => {
      h.style.left = `calc(50% - ${halfHole} - 2.5mm)`;
    });

    document.querySelectorAll('.hole-right').forEach(h => {
      h.style.left = `calc(50% + ${halfHole} + 2.5mm)`;
    });
  });

  // Dynamic Notes Menu
  const notesContainer = document.getElementById('notesGridContainer');
  const holes = document.querySelectorAll('.hole');

  holes.forEach((hole) => {
    const holeId = hole.id;
    const currentFreq = parseFloat(hole.getAttribute('data-note'));
    
    const item = document.createElement('div');
    item.className = 'note-select-item';
    
    const label = document.createElement('label');
    label.innerText = (holeId.includes('-l') ? 'Left ' : 'Right ') + (holeId.slice(-1));

    const select = document.createElement('select');
    noteOptions.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.val;
      option.innerText = opt.label;
      if (Math.abs(opt.val - currentFreq) < 1) option.selected = true;
      select.appendChild(option);
    });

    select.addEventListener('change', (e) => {
      hole.setAttribute('data-note', e.target.value);
    });

    item.appendChild(label);
    item.appendChild(select);
    notesContainer.appendChild(item);
  });

  // Bordun / Drone
  let droneActive = false;
  const droneBtn = document.getElementById('droneBtn');

  function toggleDrone(e) {
    if (e) e.preventDefault();
    droneActive = !droneActive;
    if (droneActive) {
      startTone('drone', 261.63);
      droneBtn.classList.add('active');
      droneBtn.innerText = 'Bordun: EIN';
    } else {
      stopTone('drone');
      droneBtn.classList.remove('active');
      droneBtn.innerText = 'Bordun: AUS';
    }
  }

  droneBtn.addEventListener('click', toggleDrone);
  droneBtn.addEventListener('touchstart', toggleDrone, { passive: false });

  // Multi-Touch Event System
  function handleTouches(e) {
    e.preventDefault();
    
    const currentActiveKeys = new Set();

    for (let i = 0; i < e.touches.length; i++) {
      const touch = e.touches[i];
      const elem = document.elementFromPoint(touch.clientX, touch.clientY);

      if (!elem) continue;

      if (elem.classList.contains('hole')) {
        currentActiveKeys.add(elem.id);
      } else if (elem.classList.contains('double-hole-zone')) {
        const targetIds = elem.getAttribute('data-targets').split(',');
        targetIds.forEach(id => currentActiveKeys.add(id));
      }
    }

    holes.forEach(hole => {
      const id = hole.id;
      if (currentActiveKeys.has(id)) {
        if (!hole.classList.contains('active')) {
          hole.classList.add('active');
          startTone(id, parseFloat(hole.getAttribute('data-note')));
        }
      } else {
        if (hole.classList.contains('active')) {
          hole.classList.remove('active');
          stopTone(id);
        }
      }
    });
  }

  const container = document.getElementById('instrumentContainer');
  container.addEventListener('touchstart', handleTouches, { passive: false });
  container.addEventListener('touchmove', handleTouches, { passive: false });
  container.addEventListener('touchend', handleTouches, { passive: false });
  container.addEventListener('touchcancel', handleTouches, { passive: false });
</script>

</body>
</html>
