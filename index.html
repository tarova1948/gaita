<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita / Angeion App (Real Dimensions)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }

    /* Top Bar Controls */
    .top-bar {
      position: fixed;
      top: 12px;
      z-index: 999;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      background: rgba(30, 30, 30, 0.95);
      color: #ffd700;
      border: 1.5px solid #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
      touch-action: auto;
    }
    .btn.active {
      background: #ffd700;
      color: #121212;
      box-shadow: 0 0 10px #ffd700;
    }

    /* Main Container */
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 90vh;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* Εικόνα Αυλών */
    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
      pointer-events: none;
      z-index: 10;
    }

    /* Dynamic Wooden Reeds / Καλάμια */
    .reed-pipe {
      position: absolute;
      width: 16mm;
      background: linear-gradient(90deg, #5c3a21 0%, #a0683a 30%, #c48b55 50%, #a0683a 70%, #5c3a21 100%);
      border: 2px solid #3d2312;
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5);
      z-index: 5;
      pointer-events: none;
      top: calc(150mm - 8mm);
      height: calc(320mm - 150mm + 16mm);
    }

    .reed-pipe.left {
      left: calc(50% - 4mm - 2.5mm);
      transform: translateX(-50%);
    }
    .reed-pipe.right {
      left: calc(50% + 4mm + 2.5mm);
      transform: translateX(-50%);
    }
    
    /* Dynamic Holes Base */
    .hole {
      position: absolute;
      width: 8mm;
      height: 8mm;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 215, 0, 0.85);
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: auto;
      transition: background 0.1s;
    }
    .hole.active {
      background: rgba(255, 215, 0, 0.85);
      box-shadow: 0 0 12px #ffd700;
    }

    /* Αριστερός και Δεξιός Αυλός */
    .hole-left {
      left: calc(50% - 4mm - 2.5mm);
    }
    .hole-right {
      left: calc(50% + 4mm + 2.5mm);
    }

    /* Κακόρυφες Θέσεις */
    .row-1 { top: 150mm; }
    .row-2 { top: 182mm; }
    .row-3 { top: 252mm; }
    .row-4 { top: 286mm; }
    .row-5 { top: 320mm; }

    /* Διπλές Ζώνες */
    .double-hole-zone {
      position: absolute;
      width: 25mm;
      height: 10mm;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      background: transparent;
      pointer-events: auto;
    }

    /* Modal / Ρυθμίσεις Παράθυρο */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      touch-action: auto;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #222;
      border: 2px solid #ffd700;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .modal-header h3 {
      margin: 0;
      color: #ffd700;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .setting-group {
      margin-bottom: 18px;
    }
    .setting-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ddd;
    }
    .setting-group input[type="range"] {
      width: 100%;
      accent-color: #ffd700;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .note-select-item {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .note-select-item select {
      background: #333;
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 4px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
