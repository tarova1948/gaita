<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }
    
    /* Κουρδιστήρι στο πάνω μέρος */
    .tuner-container {
      position: absolute;
      top: 10px;
      width: 90%;
      max-width: 380px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.6);
    }
    .tuner-label {
      font-size: 13px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 4px;
    }
    .tuner-slider {
      width: 100%;
      height: 6px;
      accent-color: #ffd700;
      cursor: pointer;
    }

    .app-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 88vh;
      margin-top: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    
    /* Μεγάλες διάφανες τρύπες ευθυγραμμισμένες με τους αυλούς */
    .hole {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 215, 0, 0.8);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .hole:active {
      background: rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 15px #ffd700;
    }

    /* Περιοχή για 1 δάχτυλο = 2 τρύπες μαζί */
    .double-hole-zone {
      position: absolute;
      width: 130px;
      height: 65px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
    }
  </style>
</head>
<body>

<!-- ΚΟΥΡΔΙΣΤΗΡΙ -->
<div class="tuner-container">
  <div class="tuner-label" id="tunerDisplay">Κούρδισμα: 440 Hz (Standard)</div>
  <input type="range" min="400" max="480" value="440" class="tuner-slider" id="tunerSlider">
</div>

<div class="app-container">
  <!-- Η φωτογραφία σου -->
  <img src="instrument.png" class="instrument-img" alt="Gaita">

  <!-- ΑΡΙΣΤΕΡΟΣ ΑΥΛΟΣ (5 Τρύπες) -->
  <div class="hole" style="top: 22%; left: 44%;" data-base-note="440"></div>
  <div class="hole" style="top: 32%; left: 44%;" data-base-note="494"></div>
  <div class="hole" style="top: 42%; left: 44%;" data-base-note="523"></div>
  <div class="hole" style="top: 52%; left: 44%;" data-base-note="587"></div>
  <div class="hole" style="top: 62%; left: 44%;" data-base-note="659"></div>

  <!-- ΔΕΞΙΟΣ ΑΥΛΟΣ (5 Τρύπες) -->
  <div class="hole" style="top: 22%; left: 56%;" data-base-note="698"></div>
  <div class="hole" style="top: 32%; left: 56%;" data-base-note="784"></div>
  <div class="hole" style="top: 42%; left: 56%;" data-base-note="880"></div>
  <div class="hole" style="top: 52%; left: 56%;" data-base-note="987"></div>
  <div class="hole" style="top: 62%; left: 56%;" data-base-note="1046"></div>

  <!-- ΔΙΠΛΕΣ ΖΩΝΕΣ (1 δάχτυλο = ταυτόχρονα και οι 2 τρύπες) -->
  <div class="double-hole-zone" style="top: 22%;" data-base-notes="440,698"></div>
  <div class="double-hole-zone" style="top: 32%;" data-base-notes="494,784"></div>
  <div class="double-hole-zone" style="top: 42%;" data-base-notes="523,880"></div>
  <div class="double-hole-zone" style="top: 52%;" data-base-notes="587,987"></div>
  <div class="double-hole-zone" style="top: 62%;" data-base-notes="659,1046"></div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  const tunerSlider = document.getElementById('tunerSlider');
  const tunerDisplay = document.getElementById('tunerDisplay');
  let currentPitchFactor = 1.0;

  tunerSlider.addEventListener('input', (e) => {
    const baseA = parseFloat(e.target.value);
    currentPitchFactor = baseA / 440;
    tunerDisplay.innerText = `Κούρδισμα: ${baseA} Hz`;
  });

  function playTone(baseFreq) {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = baseFreq * currentPitchFactor;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
    osc.stop(audioCtx.currentTime + 0.8);
  }

  // Μονές τρύπες
  document.querySelectorAll('.hole').forEach(hole => {
    const baseFreq = parseFloat(hole.getAttribute('data-base-note'));
    
    const handlePlay = (e) => {
      e.preventDefault();
      e.stopPropagation();
      playTone(baseFreq);
    };

    hole.addEventListener('touchstart', handlePlay);
    hole.addEventListener('mousedown', handlePlay);
  });

  // Διπλές ζώνες
  document.querySelectorAll('.double-hole-zone').forEach(zone => {
    const baseFreqs = zone.getAttribute('data-base-notes').split(',').map(Number);

    const handlePlayDouble = (e) => {
      e.preventDefault();
      baseFreqs.forEach(f => playTone(f));
    };

    zone.addEventListener('touchstart', handlePlayDouble);
    zone.addEventListener('mousedown', handlePlayDouble);
  });
</script>

</body>
</html>
