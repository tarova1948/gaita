<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gaita Walnut App</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: sans-serif;
    }
    
    /* Κουρδιστήρι */
    .tuner-container {
      position: absolute;
      top: 12px;
      width: 88%;
      max-width: 360px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(20, 10, 5, 0.85);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #d4b26f;
    }
    .tuner-label {
      font-size: 14px;
      font-weight: bold;
      color: #d4b26f;
      margin-bottom: 5px;
    }
    .tuner-slider {
      width: 100%;
      height: 6px;
      accent-color: #d4b26f;
      cursor: pointer;
    }

    .app-container {
      position: relative;
      width: 100vw;
      max-width: 400px;
      height: 85vh;
      margin-top: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .instrument-img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }
    
    /* Μεγάλες τρύπες ευθυγραμμισμένες με την καρυδιά */
    .hole {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(212, 178, 111, 0.8);
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .hole:active {
      background: rgba(212, 178, 111, 0.7);
      box-shadow: 0 0 12px #d4b26f;
    }

    /* Διπλή ζώνη (1 δάχτυλο = 2 τρύπες μαζί) */
    .double-hole-zone {
      position: absolute;
      width: 120px;
      height: 60px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 30px;
    }
  </style>
</head>
<body>

<!-- ΚΟΥΡΔΙΣΤΗΡΙ -->
<div class="tuner-container">
  <div class="tuner-label" id="tunerDisplay">Κούρδισμα: 440 Hz (Standard)</div>
  <input type="range" min="400" max="480" value="440" class="tuner-slider" id="tunerSlider">
</div>

<div class="app-container">
  <img src="instrument.png" class="instrument-img" alt="Gaita Walnut">

  <!-- ΑΡΙΣΤΕΡΟΣ ΑΥΛΟΣ -->
  <div class="hole" style="top: 24.5%; left: 45.5%;" data-base-note="440"></div>
  <div class="hole" style="top: 35%; left: 45.5%;" data-base-note="494"></div>
  <div class="hole" style="top: 45.5%; left: 45.5%;" data-base-note="523"></div>
  <div class="hole" style="top: 56%; left: 45.5%;" data-base-note="587"></div>
  <div class="hole" style="top: 66.5%; left: 45.5%;" data-base-note="659"></div>

  <!-- ΔΕΞΙΟΣ ΑΥΛΟΣ -->
  <div class="hole" style="top: 24.5%; left: 54.5%;" data-base-note="698"></div>
  <div class="hole" style="top: 35%; left: 54.5%;" data-base-note="784"></div>
  <div class="hole" style="top: 45.5%; left: 54.5%;" data-base-note="880"></div>
  <div class="hole" style="top: 56%; left: 54.5%;" data-base-note="987"></div>
  <div class="hole" style="top: 66.5%; left: 54.5%;" data-base-note="1046"></div>

  <!-- ΔΙΠΛΕΣ ΖΩΝΕΣ -->
  <div class="double-hole-zone" style="top: 24.5%;" data-base-notes="440,698"></div>
  <div class="double-hole-zone" style="top: 35%;" data-base-notes="494,784"></div>
  <div class="double-hole-zone" style="top: 45.5%;" data-base-notes="523,880"></div>
  <div class="double-hole-zone" style="top: 56%;" data-base-notes="587,987"></div>
  <div class="double-hole-zone" style="top: 66.5%;" data-base-notes="659,1046"></div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  const tunerSlider = document.getElementById('tunerSlider');
  const tunerDisplay = document.getElementById('tunerDisplay');
  let currentPitchFactor = 1.0;

  tunerSlider.addEventListener('input', (e) => {
    const baseA = parseFloat(e.target.value);
    currentPitchFactor = baseA / 440;
    tunerDisplay.innerText = `Κούρδισμα: ${baseA} Hz`;
  });

  function playTone(baseFreq) {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = baseFreq * currentPitchFactor;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
    osc.stop(audioCtx.currentTime + 0.8);
  }

  // Μονές τρύπες
  document.querySelectorAll('.hole').forEach(hole => {
    const baseFreq = parseFloat(hole.getAttribute('data-base-note'));
    
    const handlePlay = (e) => {
      e.preventDefault();
      e.stopPropagation();
      playTone(baseFreq);
    };

    hole.addEventListener('touchstart', handlePlay);
    hole.addEventListener('mousedown', handlePlay);
  });

  // Διπλές ζώνες
  document.querySelectorAll('.double-hole-zone').forEach(zone => {
    const baseFreqs = zone.getAttribute('data-base-notes').split(',').map(Number);

    const handlePlayDouble = (e) => {
      e.preventDefault();
      baseFreqs.forEach(f => playTone(f));
    };

    zone.addEventListener('touchstart', handlePlayDouble);
    zone.addEventListener('mousedown', handlePlayDouble);
  });
</script>

</body>
</html>
